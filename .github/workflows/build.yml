name: Build ReplayMod Forge 1.20.1

on:
  push:
    branches:
      - '1.20.1'
      - 'tfot/**'
  pull_request:
    branches:
      - '1.20.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ReplayMod
        run: ./gradlew build --stacktrace

      - name: Upload built JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replaymod-forge-1.20.1-${{ github.sha }}
          path: |
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
